<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Budget & Kasser</title>
    
    <!-- PWA / Web App Settings -->
    <meta name="theme-color" content="#090d16">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="data:application/json;base64,ewogICJuYW1lIjogIkJ1ZGdldCAmIEthc3NlciIsCiAgInNob3J0X25hbWUiOiAiQnVkZ2V0IiwKICAic3RhcnRfdXJsIjogIi4vIiwKICAiZGlzcGxheSI6ICJzdGFuZGFsb25lIiwKICAiYmFja2dyb3VuZF9jb2xvciI6ICIjMDkwZDE2IiwKICAidGhlbWVfY29sb3IiOiAiIzA5MGQxNiIKfQ==">

    <!-- Tailwind CSS & Lucide Icons -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        darkBg: '#090d16',
                        cardBg: '#131c2e',
                        cardBorder: '#1e293b',
                        accentGreen: '#10b981',
                        accentRed: '#ef4444',
                        accentBlue: '#3b82f6',
                        accentPurple: '#8b5cf6',
                        accentAmber: '#f59e0b',
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #090d16;
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            padding-bottom: 90px;
        }
        
        .glass-panel {
            background: rgba(19, 28, 46, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .modal-bg {
            background: rgba(5, 8, 15, 0.85);
            backdrop-filter: blur(8px);
        }

        /* Hide scrollbars but keep touch scrolling */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

    <!-- TOP HEADER -->
    <header class="sticky top-0 z-30 glass-panel px-4 py-3 flex justify-between items-center border-b border-slate-800">
        <div>
            <h1 class="text-lg font-bold bg-gradient-to-r from-emerald-400 to-blue-500 bg-clip-text text-transparent flex items-center gap-2">
                <i data-lucide="wallet" class="w-5 h-5 text-emerald-400"></i>
                Budget & Kasser
            </h1>
            <p id="current-date-text" class="text-xs text-slate-400">Indlæser dato...</p>
        </div>
        <button onclick="toggleFasteUdgifterModal()" class="p-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 transition flex items-center gap-1 text-xs font-medium">
            <i data-lucide="sliders" class="w-4 h-4 text-slate-400"></i> Fast Budget
        </button>
    </header>

    <!-- MAIN CONTENT -->
    <main class="p-4 space-y-6 max-w-md mx-auto w-full">

        <!-- OVERSIGT KORT (RÅDIGHEDSBELØB) -->
        <section class="glass-panel p-5 rounded-3xl relative overflow-hidden shadow-xl border border-slate-800/80">
            <div class="flex justify-between items-start mb-2">
                <span class="text-xs font-semibold uppercase tracking-wider text-slate-400">Månedens Rådighedsbeløb</span>
                <span id="month-progress-badge" class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-blue-500/10 text-blue-400 border border-blue-500/20">Dag X i måneden</span>
            </div>
            
            <div class="flex items-baseline gap-2 my-1">
                <span id="radighed-belob" class="text-3xl font-black text-emerald-400 tracking-tight">0 kr.</span>
                <span class="text-xs text-slate-400">tilbage i alt</span>
            </div>

            <!-- Fordelt vs Resterende progress bar -->
            <div class="mt-4 space-y-1.5">
                <div class="flex justify-between text-xs text-slate-400 font-medium">
                    <span>Fordelt i kasser: <b id="fordelt-belob" class="text-slate-200">0 kr.</b></span>
                    <span>Ufordelt: <b id="ufordelt-belob" class="text-amber-400">0 kr.</b></span>
                </div>
                <div class="w-full bg-slate-800/80 rounded-full h-2.5 overflow-hidden flex">
                    <div id="bar-fordelt" class="bg-emerald-500 h-full transition-all duration-500" style="width: 0%"></div>
                    <div id="bar-ufordelt" class="bg-amber-500 h-full transition-all duration-500" style="width: 0%"></div>
                </div>
            </div>
        </section>

        <!-- KASSER (LISTE) -->
        <section class="space-y-3">
            <div class="flex justify-between items-center px-1">
                <h2 class="text-sm font-bold text-slate-300 uppercase tracking-wider flex items-center gap-1.5">
                    <i data-lucide="boxes" class="w-4 h-4 text-purple-400"></i> Dine Kasser
                </h2>
                <span id="kasser-antal" class="text-xs text-slate-500">0 kasser</span>
            </div>

            <div id="kasser-container" class="space-y-3">
                <!-- Dynamiske kasser indsættes her via JS -->
            </div>
        </section>

        <!-- SENESTE POSTERINGER -->
        <section class="space-y-3 pt-2">
            <div class="flex justify-between items-center px-1">
                <h2 class="text-sm font-bold text-slate-300 uppercase tracking-wider flex items-center gap-1.5">
                    <i data-lucide="history" class="w-4 h-4 text-blue-400"></i> Seneste Aktivitet
                </h2>
            </div>
            <div id="transaktions-container" class="glass-panel rounded-2xl p-3 divide-y divide-slate-800/60 max-h-56 overflow-y-auto no-scrollbar">
                <!-- Dynamiske transaktioner indsættes her -->
            </div>
        </section>

    </main>

    <!-- FIXED BOTTOM BAR (S24 ERGONOMI) -->
    <nav class="fixed bottom-0 left-0 right-0 z-40 glass-panel border-t border-slate-800/80 p-3 pb-6">
        <div class="max-w-md mx-auto grid grid-cols-3 gap-2">
            <button onclick="openBrugPengeModal()" class="bg-gradient-to-r from-red-500 to-rose-600 hover:from-red-600 hover:to-rose-700 text-white font-bold py-3 px-2 rounded-2xl flex flex-col items-center justify-center gap-1 shadow-lg shadow-red-950/40 active:scale-95 transition">
                <i data-lucide="minus-circle" class="w-5 h-5"></i>
                <span class="text-xs">💸 Brug penge</span>
            </button>
            
            <button onclick="openTilfoejPengeModal()" class="bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-600 hover:to-teal-700 text-white font-bold py-3 px-2 rounded-2xl flex flex-col items-center justify-center gap-1 shadow-lg shadow-emerald-950/40 active:scale-95 transition">
                <i data-lucide="plus-circle" class="w-5 h-5"></i>
                <span class="text-xs">➕ Tilføj / Overfør</span>
            </button>

            <button onclick="openOpretKasseModal()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 font-semibold py-3 px-2 rounded-2xl flex flex-col items-center justify-center gap-1 border border-slate-700 active:scale-95 transition">
                <i data-lucide="folder-plus" class="w-5 h-5 text-purple-400"></i>
                <span class="text-xs">📦 Ny Kasse</span>
            </button>
        </div>
    </nav>

    <!-- MODAL: BRUG PENGE -->
    <div id="modal-brug-penge" class="fixed inset-0 z-50 modal-bg flex items-end sm:items-center justify-center p-0 sm:p-4 hidden">
        <div class="bg-slate-900 border border-slate-800 w-full max-w-md rounded-t-3xl sm:rounded-3xl p-5 space-y-4 shadow-2xl animate-in slide-in-from-bottom duration-200">
            <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                <h3 class="font-bold text-slate-100 flex items-center gap-2">
                    <i data-lucide="shopping-bag" class="w-5 h-5 text-red-400"></i> Brug penge fra kasse
                </h3>
                <button onclick="closeModal('modal-brug-penge')" class="p-1 rounded-lg text-slate-400 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>

            <div class="space-y-3">
                <div>
                    <label class="text-xs text-slate-400 font-medium block mb-1">Vælg kasse</label>
                    <select id="brug-kasse-select" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-slate-100 text-sm focus:outline-none focus:border-red-500"></select>
                </div>

                <div>
                    <label class="text-xs text-slate-400 font-medium block mb-1">Beløb (kr.)</label>
                    <input type="number" id="brug-belob-input" inputmode="decimal" placeholder="0" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-2xl font-bold text-red-400 focus:outline-none focus:border-red-500">
                    <!-- Quick Buttons -->
                    <div class="grid grid-cols-4 gap-1.5 mt-2">
                        <button onclick="addQuickAmount('brug-belob-input', 50)" class="bg-slate-800 text-slate-300 hover:bg-slate-700 py-1.5 text-xs font-semibold rounded-lg border border-slate-700">+50</button>
                        <button onclick="addQuickAmount('brug-belob-input', 100)" class="bg-slate-800 text-slate-300 hover:bg-slate-700 py-1.5 text-xs font-semibold rounded-lg border border-slate-700">+100</button>
                        <button onclick="addQuickAmount('brug-belob-input', 200)" class="bg-slate-800 text-slate-300 hover:bg-slate-700 py-1.5 text-xs font-semibold rounded-lg border border-slate-700">+200</button>
                        <button onclick="addQuickAmount('brug-belob-input', 500)" class="bg-slate-800 text-slate-300 hover:bg-slate-700 py-1.5 text-xs font-semibold rounded-lg border border-slate-700">+500</button>
                    </div>
                </div>

                <div>
                    <label class="text-xs text-slate-400 font-medium block mb-1">Tekst / Bemærkning (Valgfri)</label>
                    <input type="text" id="brug-tekst-input" placeholder="f.eks. Rema 1000, Føtex" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-slate-100 text-sm focus:outline-none focus:border-red-500">
                </div>
            </div>

            <button onclick="gemBrugPenge()" class="w-full bg-red-500 hover:bg-red-600 text-white font-bold py-3.5 rounded-xl transition active:scale-98 shadow-lg shadow-red-950/50">
                Registrer forbrug
            </button>
        </div>
    </div>

    <!-- MODAL: TILFØJ / OVERFØR -->
    <div id="modal-tilfoej-penge" class="fixed inset-0 z-50 modal-bg flex items-end sm:items-center justify-center p-0 sm:p-4 hidden">
        <div class="bg-slate-900 border border-slate-800 w-full max-w-md rounded-t-3xl sm:rounded-3xl p-5 space-y-4 shadow-2xl animate-in slide-in-from-bottom duration-200">
            <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                <h3 class="font-bold text-slate-100 flex items-center gap-2">
                    <i data-lucide="piggy-bank" class="w-5 h-5 text-emerald-400"></i> Tilføj penge til kasse
                </h3>
                <button onclick="closeModal('modal-tilfoej-penge')" class="p-1 rounded-lg text-slate-400 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>

            <div class="space-y-3">
                <div>
                    <label class="text-xs text-slate-400 font-medium block mb-1">Vælg kasse</label>
                    <select id="tilfoej-kasse-select" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-slate-100 text-sm focus:outline-none focus:border-emerald-500"></select>
                </div>

                <div>
                    <label class="text-xs text-slate-400 font-medium block mb-1">Beløb (kr.)</label>
                    <input type="number" id="tilfoej-belob-input" inputmode="decimal" placeholder="0" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-2xl font-bold text-emerald-400 focus:outline-none focus:border-emerald-500">
                </div>

                <div>
                    <label class="text-xs text-slate-400 font-medium block mb-1">Tekst / Bemærkning (Valgfri)</label>
                    <input type="text" id="tilfoej-tekst-input" placeholder="f.eks. Månedlig indsætning, Mellem-overførsel" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-slate-100 text-sm focus:outline-none focus:border-emerald-500">
                </div>
            </div>

            <button onclick="gemTilfoejPenge()" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-3.5 rounded-xl transition active:scale-98 shadow-lg shadow-emerald-950/50">
                Indsæt beløb
            </button>
        </div>
    </div>

    <!-- MODAL: OPRET KASSE -->
    <div id="modal-opret-kasse" class="fixed inset-0 z-50 modal-bg flex items-end sm:items-center justify-center p-0 sm:p-4 hidden">
        <div class="bg-slate-900 border border-slate-800 w-full max-w-md rounded-t-3xl sm:rounded-3xl p-5 space-y-4 shadow-2xl">
            <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                <h3 class="font-bold text-slate-100 flex items-center gap-2">
                    <i data-lucide="folder-plus" class="w-5 h-5 text-purple-400"></i> Opret Ny Kasse
                </h3>
                <button onclick="closeModal('modal-opret-kasse')" class="p-1 rounded-lg text-slate-400 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>

            <div class="space-y-3">
                <div>
                    <label class="text-xs text-slate-400 font-medium block mb-1">Kassens Navn</label>
                    <input type="text" id="ny-kasse-navn" placeholder="f.eks. Dagligvarer, Flytte-opsparing" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-slate-100 text-sm focus:outline-none focus:border-purple-500">
                </div>

                <div>
                    <label class="text-xs text-slate-400 font-medium block mb-1">Mål / Budget for kassen (kr.)</label>
                    <input type="number" id="ny-kasse-maal" inputmode="decimal" placeholder="0 hvis intet fast mål" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-slate-100 text-sm focus:outline-none focus:border-purple-500">
                </div>

                <div>
                    <label class="text-xs text-slate-400 font-medium block mb-1">Start-saldo i kassen (kr.)</label>
                    <input type="number" id="ny-kasse-saldo" inputmode="decimal" placeholder="0" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-slate-100 text-sm focus:outline-none focus:border-purple-500">
                </div>
            </div>

            <button onclick="gemNyKasse()" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-3.5 rounded-xl transition active:scale-98">
                Opret kasse
            </button>
        </div>
    </div>

    <!-- MODAL: FASTE UDGIFTER -->
    <div id="modal-faste-udgifter" class="fixed inset-0 z-50 modal-bg flex items-end sm:items-center justify-center p-0 sm:p-4 hidden">
        <div class="bg-slate-900 border border-slate-800 w-full max-w-md rounded-t-3xl sm:rounded-3xl p-5 space-y-4 shadow-2xl max-h-[85vh] flex flex-col">
            <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                <h3 class="font-bold text-slate-100 flex items-center gap-2">
                    <i data-lucide="sliders" class="w-5 h-5 text-emerald-400"></i> Faste Indtægter & Udgifter
                </h3>
                <button onclick="closeModal('modal-faste-udgifter')" class="p-1 rounded-lg text-slate-400 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>

            <div class="space-y-4 overflow-y-auto pr-1 no-scrollbar flex-1">
                <div>
                    <label class="text-xs text-slate-400 font-medium block mb-1">Månedlig Indtægt (Udbetalt løn i alt)</label>
                    <input type="number" id="fast-indtaegt-input" inputmode="decimal" onchange="opdaterIndtaegt(this.value)" placeholder="0" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-xl font-bold text-emerald-400">
                </div>

                <hr class="border-slate-800">

                <div class="space-y-2">
                    <label class="text-xs text-slate-400 font-medium block">Faste udgifter (Husleje, El, Lån osv.)</label>
                    
                    <div class="flex gap-2">
                        <input type="text" id="ny-udgift-navn" placeholder="Tekst (f.eks. Husleje)" class="flex-1 bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-xs text-slate-100">
                        <input type="number" id="ny-udgift-belob" inputmode="decimal" placeholder="Kr." class="w-24 bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-xs text-slate-100">
                        <button onclick="tilfoejFastUdgift()" class="bg-emerald-600 hover:bg-emerald-700 text-white p-2.5 rounded-xl"><i data-lucide="plus" class="w-4 h-4"></i></button>
                    </div>

                    <div id="faste-udgifter-liste" class="space-y-1.5 pt-2">
                        <!-- Indsættes dynamisk -->
                    </div>
                </div>
            </div>

            <button onclick="closeModal('modal-faste-udgifter')" class="w-full bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold py-3 rounded-xl">
                Gem & Luk
            </button>
        </div>
    </div>

    <!-- LOGIK (JAVASCRIPT) -->
    <script>
        // STANDARD STATE
        let appData = {
            indtaegt: 0,
            fasteUdgifter: [],
            kasser: [
                { id: 'k1', navn: 'Dagligvarer', maal: 5000, saldo: 3500 },
                { id: 'k2', navn: 'Diverse', maal: 2000, saldo: 1200 },
                { id: 'k3', navn: 'Flytte-forbedringer', maal: 10000, saldo: 2500 },
                { id: 'k4', navn: 'Flytte-opsparing', maal: 15000, saldo: 6000 },
                { id: 'k5', navn: 'Opsparing', maal: 20000, saldo: 12000 }
            ],
            transaktioner: []
        };

        // VIBRATION FEEDBACK (S24)
        function triggerHaptic(type = 'click') {
            if ('vibrate' in navigator) {
                if (type === 'click') navigator.vibrate(25);
                if (type === 'success') navigator.vibrate([40, 60, 40]);
            }
        }

        // LOAD DATA
        function loadData() {
            const saved = localStorage.getItem('budget_pwa_data');
            if (saved) {
                try {
                    appData = JSON.parse(saved);
                } catch(e) { console.error(e); }
            }
            renderApp();
        }

        // SAVE DATA
        function saveData() {
            localStorage.setItem('budget_pwa_data', JSON.stringify(appData));
            renderApp();
        }

        // RENDER HELE APPEN
        function renderApp() {
            // 1. Datoer
            const now = new Date();
            const dateOptions = { weekday: 'long', day: 'numeric', month: 'long' };
            document.getElementById('current-date-text').innerText = now.toLocaleDateString('da-DK', dateOptions);

            const daysInMonth = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
            document.getElementById('month-progress-badge').innerText = `Dag ${now.getDate()} i måneden (${daysInMonth - now.getDate()} dage tilbage)`;

            // 2. Beregn Total Faste Udgifter & Rådighedsbeløb
            const samletFaste = appData.fasteUdgifter.reduce((acc, u) => acc + Number(u.belob), 0);
            const radighedsBelob = Math.max(0, appData.indtaegt - samletFaste);

            // 3. Beregn fordelt i kasser
            const samletIKasser = appData.kasser.reduce((acc, k) => acc + Number(k.saldo), 0);
            const ufordelt = radighedsBelob - samletIKasser;

            document.getElementById('radighed-belob').innerText = radighedsBelob.toLocaleString('da-DK') + ' kr.';
            document.getElementById('fordelt-belob').innerText = samletIKasser.toLocaleString('da-DK') + ' kr.';
            document.getElementById('ufordelt-belob').innerText = ufordelt.toLocaleString('da-DK') + ' kr.';

            // Progress Barer
            const fordeltPct = radighedsBelob > 0 ? Math.min(100, (samletIKasser / radighedsBelob) * 100) : 0;
            const ufordeltPct = radighedsBelob > 0 ? Math.max(0, (ufordelt / radighedsBelob) * 100) : 0;
            
            document.getElementById('bar-fordelt').style.width = fordeltPct + '%';
            document.getElementById('bar-ufordelt').style.width = ufordeltPct + '%';

            // 4. Render Kasser
            const kasserContainer = document.getElementById('kasser-container');
            kasserContainer.innerHTML = '';
            document.getElementById('kasser-antal').innerText = `${appData.kasser.length} kasser`;

            appData.kasser.forEach(k => {
                const pct = k.maal > 0 ? Math.min(100, Math.round((k.saldo / k.maal) * 100)) : 0;
                const isGoalReached = k.maal > 0 && k.saldo >= k.maal;

                const card = document.createElement('div');
                card.className = 'glass-panel p-4 rounded-2xl border border-slate-800/80 relative space-y-2';
                
                card.innerHTML = `
                    <div class="flex justify-between items-start">
                        <div>
                            <div class="flex items-center gap-1.5">
                                <h3 class="font-bold text-slate-100">${k.navn}</h3>
                                ${isGoalReached ? '<span class="text-[10px] bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 font-bold px-1.5 py-0.5 rounded-full">🎉 Mål Nået!</span>' : ''}
                            </div>
                            <p class="text-xs text-slate-400">
                                ${k.maal > 0 ? `Mål: ${Number(k.maal).toLocaleString('da-DK')} kr.` : 'Intet fast mål'}
                            </p>
                        </div>
                        <div class="flex items-center gap-2">
                            <span class="text-lg font-black ${k.saldo < 0 ? 'text-red-400' : 'text-slate-100'}">
                                ${Number(k.saldo).toLocaleString('da-DK')} kr.
                            </span>
                            <button onclick="sletKasse('${k.id}')" class="text-slate-600 hover:text-red-400 p-1 rounded-lg transition">
                                <i data-lucide="trash-2" class="w-4 h-4"></i>
                            </button>
                        </div>
                    </div>

                    ${k.maal > 0 ? `
                        <div class="space-y-1">
                            <div class="flex justify-between text-[11px] text-slate-400 font-medium">
                                <span>Fremskridt</span>
                                <span class="${isGoalReached ? 'text-emerald-400 font-bold' : ''}">${pct}%</span>
                            </div>
                            <div class="w-full bg-slate-800 rounded-full h-2 overflow-hidden">
                                <div class="${isGoalReached ? 'bg-emerald-400' : 'bg-purple-500'} h-full transition-all duration-500" style="width: ${pct}%"></div>
                            </div>
                        </div>
                    ` : ''}
                `;
                kasserContainer.appendChild(card);
            });

            // 5. Render Transaktioner
            const txContainer = document.getElementById('transaktions-container');
            txContainer.innerHTML = '';

            if (appData.transaktioner.length === 0) {
                txContainer.innerHTML = '<p class="text-xs text-slate-500 text-center py-4">Ingen registreringer endnu</p>';
            } else {
                appData.transaktioner.slice(0, 15).forEach(t => {
                    const item = document.createElement('div');
                    item.className = 'py-2.5 flex justify-between items-center text-xs';
                    const isMinus = t.type === 'brug';
                    
                    item.innerHTML = `
                        <div class="space-y-0.5">
                            <p class="font-medium text-slate-200">${t.kasseNavn} <span class="text-slate-500">• ${t.tekst || (isMinus ? 'Forbrug' : 'Indsætning')}</span></p>
                            <p class="text-[10px] text-slate-500">${t.dato}</p>
                        </div>
                        <div class="flex items-center gap-2">
                            <span class="font-bold ${isMinus ? 'text-red-400' : 'text-emerald-400'}">
                                ${isMinus ? '-' : '+'}${Number(t.belob).toLocaleString('da-DK')} kr.
                            </span>
                            <button onclick="sletTransaktion('${t.id}')" class="text-slate-600 hover:text-red-400 p-1">
                                <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                            </button>
                        </div>
                    `;
                    txContainer.appendChild(item);
                });
            }

            // Update Select Dropdowns
            updateSelectOptions();
            lucide.createIcons();
        }

        // UPDATE SELECT DROPDOWNS
        function updateSelectOptions() {
            const brugSelect = document.getElementById('brug-kasse-select');
            const tilfoejSelect = document.getElementById('tilfoej-kasse-select');
            
            brugSelect.innerHTML = '';
            tilfoejSelect.innerHTML = '';

            appData.kasser.forEach(k => {
                const opt1 = document.createElement('option');
                opt1.value = k.id;
                opt1.innerText = `${k.navn} (${k.saldo} kr.)`;
                brugSelect.appendChild(opt1);

                const opt2 = document.createElement('option');
                opt2.value = k.id;
                opt2.innerText = `${k.navn} (${k.saldo} kr.)`;
                tilfoejSelect.appendChild(opt2);
            });
        }

        // MODAL HANDLERS
        function openBrugPengeModal() {
            triggerHaptic();
            document.getElementById('modal-brug-penge').classList.remove('hidden');
            document.getElementById('brug-belob-input').focus();
        }

        function openTilfoejPengeModal() {
            triggerHaptic();
            document.getElementById('modal-tilfoej-penge').classList.remove('hidden');
            document.getElementById('tilfoej-belob-input').focus();
        }

        function openOpretKasseModal() {
            triggerHaptic();
            document.getElementById('modal-opret-kasse').classList.remove('hidden');
        }

        function toggleFasteUdgifterModal() {
            triggerHaptic();
            const modal = document.getElementById('modal-faste-udgifter');
            modal.classList.toggle('hidden');
            if(!modal.classList.contains('hidden')) {
                document.getElementById('fast-indtaegt-input').value = appData.indtaegt || '';
                renderFasteUdgifterListe();
            }
        }

        function closeModal(id) {
            document.getElementById(id).classList.add('hidden');
        }

        // QUICK AMOUNT HELPER
        function addQuickAmount(inputId, val) {
            triggerHaptic();
            const input = document.getElementById(inputId);
            const current = Number(input.value) || 0;
            input.value = current + val;
        }

        // GEM BRUG PENGE
        function gemBrugPenge() {
            const kasseId = document.getElementById('brug-kasse-select').value;
            const belob = Number(document.getElementById('brug-belob-input').value);
            const tekst = document.getElementById('brug-tekst-input').value;

            if (!kasseId || !belob || belob <= 0) return;

            const kasse = appData.kasser.find(k => k.id === kasseId);
            if (kasse) {
                kasse.saldo -= belob;
                appData.transaktioner.unshift({
                    id: Date.now().toString(),
                    kasseId: kasse.id,
                    kasseNavn: kasse.navn,
                    type: 'brug',
                    belob: belob,
                    tekst: tekst,
                    dato: new Date().toLocaleDateString('da-DK', { hour: '2-digit', minute: '2-digit', day: 'numeric', month: 'short' })
                });

                triggerHaptic('click');
                saveData();
                closeModal('modal-brug-penge');
                document.getElementById('brug-belob-input').value = '';
                document.getElementById('brug-tekst-input').value = '';
            }
        }

        // GEM TILFØJ PENGE
        function gemTilfoejPenge() {
            const kasseId = document.getElementById('tilfoej-kasse-select').value;
            const belob = Number(document.getElementById('tilfoej-belob-input').value);
            const tekst = document.getElementById('tilfoej-tekst-input').value;

            if (!kasseId || !belob || belob <= 0) return;

            const kasse = appData.kasser.find(k => k.id === kasseId);
            if (kasse) {
                const gammelSaldo = kasse.saldo;
                kasse.saldo += belob;

                // Tjek om mål er opnået for konfetti & haptik fejring!
                if (kasse.maal > 0 && gammelSaldo < kasse.maal && kasse.saldo >= kasse.maal) {
                    confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
                    triggerHaptic('success');
                } else {
                    triggerHaptic('click');
                }

                appData.transaktioner.unshift({
                    id: Date.now().toString(),
                    kasseId: kasse.id,
                    kasseNavn: kasse.navn,
                    type: 'tilfoej',
                    belob: belob,
                    tekst: tekst,
                    dato: new Date().toLocaleDateString('da-DK', { hour: '2-digit', minute: '2-digit', day: 'numeric', month: 'short' })
                });

                saveData();
                closeModal('modal-tilfoej-penge');
                document.getElementById('tilfoej-belob-input').value = '';
                document.getElementById('tilfoej-tekst-input').value = '';
            }
        }

        // GEM NY KASSE
        function gemNyKasse() {
            const navn = document.getElementById('ny-kasse-navn').value;
            const maal = Number(document.getElementById('ny-kasse-maal').value) || 0;
            const saldo = Number(document.getElementById('ny-kasse-saldo').value) || 0;

            if (!navn) return;

            appData.kasser.push({
                id: 'k_' + Date.now(),
                navn: navn,
                maal: maal,
                saldo: saldo
            });

            triggerHaptic('click');
            saveData();
            closeModal('modal-opret-kasse');
            document.getElementById('ny-kasse-navn').value = '';
            document.getElementById('ny-kasse-maal').value = '';
            document.getElementById('ny-kasse-saldo').value = '';
        }

        // SLET KASSE
        function sletKasse(id) {
            if (confirm('Vil du slette denne kasse?')) {
                appData.kasser = appData.kasser.filter(k => k.id !== id);
                triggerHaptic();
                saveData();
            }
        }

        // SLET TRANSAKTION (GENOPRET SALDO)
        function sletTransaktion(id) {
            const tx = appData.transaktioner.find(t => t.id === id);
            if (tx && confirm('Slet denne postering og rulle beløbet tilbage?')) {
                const kasse = appData.kasser.find(k => k.id === tx.kasseId);
                if (kasse) {
                    if (tx.type === 'brug') kasse.saldo += tx.belob;
                    if (tx.type === 'tilfoej') kasse.saldo -= tx.belob;
                }
                appData.transaktioner = appData.transaktioner.filter(t => t.id !== id);
                triggerHaptic();
                saveData();
            }
        }

        // FASTE UDGIFTER LOGIK
        function opdaterIndtaegt(val) {
            appData.indtaegt = Number(val) || 0;
            saveData();
        }

        function tilfoejFastUdgift() {
            const navn = document.getElementById('ny-udgift-navn').value;
            const belob = Number(document.getElementById('ny-udgift-belob').value);

            if (!navn || !belob) return;

            appData.fasteUdgifter.push({
                id: 'u_' + Date.now(),
                navn: navn,
                belob: belob
            });

            document.getElementById('ny-udgift-navn').value = '';
            document.getElementById('ny-udgift-belob').value = '';
            triggerHaptic();
            saveData();
            renderFasteUdgifterListe();
        }

        function sletFastUdgift(id) {
            appData.fasteUdgifter = appData.fasteUdgifter.filter(u => u.id !== id);
            triggerHaptic();
            saveData();
            renderFasteUdgifterListe();
        }

        function renderFasteUdgifterListe() {
            const container = document.getElementById('faste-udgifter-liste');
            container.innerHTML = '';

            appData.fasteUdgifter.forEach(u => {
                const row = document.createElement('div');
                row.className = 'flex justify-between items-center bg-slate-800/60 p-2.5 rounded-xl text-xs';
                row.innerHTML = `
                    <span class="text-slate-200 font-medium">${u.navn}</span>
                    <div class="flex items-center gap-2">
                        <span class="font-bold text-slate-300">${Number(u.belob).toLocaleString('da-DK')} kr.</span>
                        <button onclick="sletFastUdgift('${u.id}')" class="text-slate-500 hover:text-red-400"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>
                    </div>
                `;
                container.appendChild(row);
            });
            lucide.createIcons();
        }

        // INIT UPON LOAD
        window.addEventListener('DOMContentLoaded', () => {
            loadData();
        });
    </script>
</body>
</html>
